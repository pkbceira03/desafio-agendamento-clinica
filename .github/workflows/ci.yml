name: CI Fullstack

on:
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agendamento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./Backend 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package.json 

      - name: Instalar dependências
        run: npm install

      - name: Executar Migrations do Prisma
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agendamento_test?schema=public"
        run: npx prisma migrate deploy

      - name: Executar Testes do Backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agendamento_test?schema=public"
        run: npm run test

      - name: Validar Build do Backend
        run: npm run build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json 

      - name: Instalar dependências
        run: npm install

      - name: Executar Testes do Frontend
        run: npm run test

      - name: Validar Build do Frontend
        run: npm run build